name: Finish RAR extraction

on:
  workflow_run:
    workflows: ["Extract 2.rar"]
    types: [completed]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract 2.rar into repository
        shell: bash
        run: |
          test -f 2.rar
          rm -rf .extract_tmp
          mkdir -p .extract_tmp
          7z x 2.rar -o.extract_tmp -y
          cp -a .extract_tmp/. .
          rm -rf .extract_tmp

      - name: Remove temporary extraction machinery
        shell: bash
        run: |
          rm -f .extract-trigger
          rm -f .github/workflows/extract-rar.yml
          rm -f .github/workflows/finish-extraction.yml

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit -m "Extract 2.rar into repository and finalize"
          git push origin HEAD:main
