name: Stage 8 Snapshot Generator

on:
  push:
    branches:
      - stage8-pc-agent-foundation

permissions:
  contents: write

jobs:
  generate:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check local .NET
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\dotnet\dotnet.exe')) {
            throw 'C:\dotnet\dotnet.exe not found on the self-hosted runner.'
          }
          'C:\dotnet' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'DOTNET_ROOT=C:\dotnet' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & 'C:\dotnet\dotnet.exe' --info

      - name: Restore and install EF tool
        shell: pwsh
        run: |
          dotnet restore GameNetManager.sln
          dotnet tool update --global dotnet-ef --version 10.0.12
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global dotnet-ef --version 10.0.12
          }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate authoritative EF snapshot
        shell: pwsh
        run: |
          dotnet build GameNetManager.sln --configuration Release --no-restore
          dotnet ef migrations add Stage8SnapshotProbe --project src/Server/GameNetManager.Server.csproj --startup-project src/Server/GameNetManager.Server.csproj --configuration Release --output-dir Data/Migrations/Stage8SnapshotProbe --no-build

      - name: Commit authoritative EF snapshot
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Server/Data/Migrations/GameNetDbContextModelSnapshot.cs
          if (git diff --cached --quiet) {
            Write-Host 'EF snapshot is already synchronized.'
            exit 0
          }
          git commit -m "chore: sync EF model snapshot"
          git push origin HEAD:stage8-pc-agent-foundation
