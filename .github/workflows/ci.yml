name: GameNet Manager CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gamenet-ci-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check local .NET
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\dotnet\dotnet.exe')) {
            throw 'C:\dotnet\dotnet.exe not found on the self-hosted runner.'
          }
          & 'C:\dotnet\dotnet.exe' --info
          'C:\dotnet' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'DOTNET_ROOT=C:\dotnet' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Dashboard/package-lock.json

      - name: Restore .NET
        run: dotnet restore GameNetManager.sln

      - name: Build .NET
        run: dotnet build GameNetManager.sln --no-restore --configuration Release

      - name: Test .NET
        run: dotnet test GameNetManager.sln --no-build --configuration Release

      - name: Server startup and migration smoke
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'gamenet-server-smoke.db'
          $stdout = Join-Path $env:RUNNER_TEMP 'gamenet-server-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'gamenet-server-smoke.stderr.log'
          Remove-Item $db,$stdout,$stderr -Force -ErrorAction SilentlyContinue

          $port = 15080
          while (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) {
            $port++
            if ($port -gt 15980) { throw 'No free Server smoke port is available.' }
          }
          $baseUrl = "http://127.0.0.1:$port"

          $env:ASPNETCORE_ENVIRONMENT = 'Development'
          $env:ASPNETCORE_URLS = $baseUrl
          $env:Database__FileName = $db

          $process = Start-Process -FilePath 'dotnet' -ArgumentList @(
            'run','--no-build','--configuration','Release',
            '--project','src\Server\GameNetManager.Server.csproj',
            '--no-launch-profile'
          ) -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($process.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri "$baseUrl/api/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              Write-Host '--- Server stdout ---'
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host '--- Server stderr ---'
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Server did not reach /api/health on port 5080.'
            }
            Write-Host 'Server startup, EF migrations and /api/health passed.'

            $customers = Invoke-RestMethod -Uri "$baseUrl/api/customers" -Method Get
            if (@($customers).Count -lt 1) { throw 'Customer API returned no seeded customers.' }

            $packages = Invoke-RestMethod -Uri "$baseUrl/api/vip-packages" -Method Get
            if (@($packages).Count -lt 1) { throw 'VIP package API returned no active packages.' }

            $smokeId = [Guid]::NewGuid().ToString('N').Substring(0, 8)
            $newCustomer = Invoke-RestMethod -Uri "$baseUrl/api/customers" -Method Post -ContentType 'application/json' -Body (@{
              fullName = "Stage 5 Smoke $smokeId"
              username = "smoke_$smokeId"
              vipTier = 'none'
              concurrentLoginLimit = 3
              password = 'Smoke123!'
            } | ConvertTo-Json)

            $customerId = $newCustomer.id
            if (-not $customerId) { throw 'Customer create smoke did not return an id.' }

            $updatedCustomer = Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId") -Method Put -ContentType 'application/json' -Body (@{
              fullName = "Stage 5 Smoke Updated $smokeId"
              code = $newCustomer.code
              username = $newCustomer.username
              vipTier = 'none'
              concurrentLoginLimit = 3
            } | ConvertTo-Json)

            if ($updatedCustomer.fullName -ne "Stage 5 Smoke Updated $smokeId") {
              throw 'Customer update smoke returned the wrong name.'
            }

            $packageId = @($packages)[0].id
            $assignment = Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/vip-package") -Method Post -ContentType 'application/json' -Body (@{
              vipPackageId = $packageId
            } | ConvertTo-Json)

            Write-Host ("VIP assignment response: packageId={0}; dailyMinutes={1}; totalMinutes={2}; discountPercent={3}" -f $assignment.packageId, $assignment.dailyMinutes, $assignment.totalMinutes, $assignment.discountPercent)
            Write-Host ("Selected package: packageId={0}; dailyMinutes={1}; totalMinutes={2}" -f $packageId, @($packages)[0].dailyMinutes, @($packages)[0].totalMinutes)
            if ($assignment.packageId -ne $packageId -or [int]$assignment.dailyMinutes -le 0 -or [int]$assignment.totalMinutes -le 0) {
              throw 'VIP package assignment smoke returned incomplete data.'
            }

            $usageBefore = Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/vip-usage") -Method Get
            if (-not $usageBefore.active -or [int]$usageBefore.usedTodayMinutes -ne 0 -or [int]$usageBefore.usedTotalMinutes -ne 0) {
              throw 'Initial VIP usage smoke returned unexpected values.'
            }

            $dashboard = Invoke-RestMethod -Uri "$baseUrl/api/dashboard" -Method Get
            $availableStation = @($dashboard.stations | Where-Object { $_.state -eq 'Available' }) | Select-Object -First 1
            if (-not $availableStation) { throw 'No available station was found for VIP usage smoke.' }

            $startedSession = Invoke-RestMethod -Uri "$baseUrl/api/sessions" -Method Post -ContentType 'application/json' -Body (@{
              customerId = $customerId
              stationId = $availableStation.id
              persons = 1
            } | ConvertTo-Json)
            if (-not $startedSession.sessionId) { throw 'VIP usage session smoke did not return a session id.' }

            Start-Sleep -Milliseconds 1200

            $usageAfterSession = Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/vip-usage") -Method Get
            if ([int]$usageAfterSession.usedTotalMinutes -lt 1 -or [int]$usageAfterSession.usedTodayMinutes -lt 1) {
              throw 'VIP usage did not account for the active session.'
            }
            if ([int]$usageAfterSession.remainingTotalMinutes -ge [int]$assignment.totalMinutes -or [int]$usageAfterSession.remainingTodayMinutes -ge [int]$assignment.dailyMinutes) {
              throw 'VIP remaining minutes did not decrease after the session started.'
            }

            $history = Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/history") -Method Get
            if (-not @($history | Where-Object { $_.type -eq 'session' -and $_.referenceId -eq $startedSession.sessionId })) {
              throw 'Customer history did not include the newly started session.'
            }

            $loginKeys = @('smoke-a', 'smoke-b', 'smoke-c')
            foreach ($clientKey in $loginKeys) {
              $loginResult = Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/login-acquire") -Method Post -ContentType 'application/json' -Body (@{ clientKey = $clientKey } | ConvertTo-Json)
              if (-not $loginResult.acquired) { throw "Concurrent login acquire failed for $clientKey." }
            }
            try {
              Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/login-acquire") -Method Post -ContentType 'application/json' -Body (@{ clientKey = 'smoke-d' } | ConvertTo-Json) | Out-Null
              throw 'Concurrent login limit was not enforced.'
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              if ($status -ne 409) { throw }
            }
            foreach ($clientKey in $loginKeys) {
              Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/login-release") -Method Post -ContentType 'application/json' -Body (@{ clientKey = $clientKey } | ConvertTo-Json) | Out-Null
            }

            $auth = Invoke-RestMethod -Uri "$baseUrl/api/customer-auth/login" -Method Post -ContentType 'application/json' -Body (@{
              usernameOrCode = $newCustomer.username
              password = 'Smoke123!'
              clientKey = 'credential-smoke'
            } | ConvertTo-Json)
            if (-not $auth.authenticated) { throw 'Customer credential authentication failed.' }
            Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/login-release") -Method Post -ContentType 'application/json' -Body (@{ clientKey = 'credential-smoke' } | ConvertTo-Json) | Out-Null

            $debt = Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/debt") -Method Post -ContentType 'application/json' -Body (@{
              amount = 55000
              description = 'Stage 5 debt smoke'
            } | ConvertTo-Json)
            $debts = Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/debts") -Method Get
            if (@($debts).Count -ne 1 -or [int]@($debts)[0].amount -ne 55000) { throw 'Customer debt listing smoke failed.' }
            $settled = Invoke-RestMethod -Uri ("$baseUrl/api/customers/$customerId/debts/$($debt.invoiceId)/settle") -Method Post -ContentType 'application/json' -Body (@{
              method = 'cash'
            } | ConvertTo-Json)
            if ([int]$settled.debtRemaining -ne 0) { throw 'Customer debt settlement smoke failed.' }

            $inventoryProducts = Invoke-RestMethod -Uri "$baseUrl/api/buffet/products" -Method Get
            if (@($inventoryProducts).Count -lt 1) { throw 'Buffet product API returned no products.' }

            $inventoryId = [Guid]::NewGuid().ToString('N').Substring(0, 8)
            $inventoryProduct = Invoke-RestMethod -Uri "$baseUrl/api/buffet/products" -Method Post -ContentType 'application/json' -Body (@{
              name = "Stage 6 Smoke $inventoryId"
              category = 'تنقلات'
              unitPrice = 25000
              costPrice = 12000
              initialStock = 5
            } | ConvertTo-Json)

            if (-not $inventoryProduct.id -or [int]$inventoryProduct.stock -ne 5) {
              throw 'Buffet product creation smoke failed.'
            }

            $stockOut = Invoke-RestMethod -Uri ("$baseUrl/api/buffet/products/$($inventoryProduct.id)/stock") -Method Post -ContentType 'application/json' -Body (@{
              quantity = 1
              direction = 'Out'
              notes = 'Stage 6 manual test'
            } | ConvertTo-Json)
            if ([int]$stockOut.stock -ne 4) { throw 'Inventory stock adjustment smoke failed.' }

            $sale = Invoke-RestMethod -Uri "$baseUrl/api/buffet/sales" -Method Post -ContentType 'application/json' -Body (@{
              items = @(@{ productId = $inventoryProduct.id; quantity = 2 })
              target = 'standalone'
            } | ConvertTo-Json)
            if ([int]$sale.total -ne 50000) { throw 'Buffet sale total smoke failed.' }

            $inventoryAfterSale = Invoke-RestMethod -Uri "$baseUrl/api/buffet/products" -Method Get
            $soldProduct = @($inventoryAfterSale | Where-Object { $_.id -eq $inventoryProduct.id })[0]
            if ([int]$soldProduct.stock -ne 2) { throw 'Buffet sale did not reduce server stock atomically.' }

            try {
              Invoke-RestMethod -Uri "$baseUrl/api/buffet/sales" -Method Post -ContentType 'application/json' -Body (@{
                items = @(@{ productId = $inventoryProduct.id; quantity = 99 })
                target = 'standalone'
              } | ConvertTo-Json) | Out-Null
              throw 'Insufficient stock sale was not rejected.'
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              if ($status -ne 409) { throw }
            }

            $inventoryAfterRejectedSale = Invoke-RestMethod -Uri "$baseUrl/api/buffet/products" -Method Get
            $unchangedProduct = @($inventoryAfterRejectedSale | Where-Object { $_.id -eq $inventoryProduct.id })[0]
            if ([int]$unchangedProduct.stock -ne 2) { throw 'Rejected buffet sale changed server stock.' }

            $inventoryHistory = Invoke-RestMethod -Uri "$baseUrl/api/buffet/inventory-transactions" -Method Get
            if (-not @($inventoryHistory | Where-Object { $_.productId -eq $inventoryProduct.id })) {
              throw 'Inventory transaction history did not contain the new product movements.'
            }

            $updatedProduct = Invoke-RestMethod -Uri ("$baseUrl/api/buffet/products/$($inventoryProduct.id)") -Method Put -ContentType 'application/json' -Body (@{
              name = "Stage 6 Smoke Updated $inventoryId"
              category = 'تنقلات'
              unitPrice = 30000
              costPrice = 14000
              isActive = $true
            } | ConvertTo-Json)
            if ($updatedProduct.name -ne "Stage 6 Smoke Updated $inventoryId" -or [int]$updatedProduct.price -ne 30000) {
              throw 'Buffet product update smoke failed.'
            }

            Write-Host 'Stage 5 Customer CRUD + VIP package + credentials + concurrent login + debt API smoke passed.'

          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Install Dashboard
        run: npm ci --prefix src/Dashboard

      - name: Lint Dashboard
        run: npm run lint --prefix src/Dashboard

      - name: Build Dashboard
        run: npm run build --prefix src/Dashboard

      - name: Start Dashboard preview
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'npm.cmd' -ArgumentList @('run','preview','--prefix','src/Dashboard','--','--host','127.0.0.1','--port','4173') -PassThru
          $process.Id | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'gamenet-dashboard.pid') -Encoding utf8
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $response) { throw 'Dashboard preview did not start on port 4173.' }

      - name: Install Dashboard browser test dependency
        shell: pwsh
        run: npm install --prefix src/Dashboard --no-save --no-package-lock @playwright/test@1.63.0

      - name: Dashboard interaction smoke
        shell: pwsh
        run: |
          $env:NODE_PATH = Join-Path $env:GITHUB_WORKSPACE 'src\Dashboard\node_modules'
          npx --prefix src/Dashboard playwright test --config "$env:GITHUB_WORKSPACE\e2e\playwright.config.cjs" --workers=1

      - name: Stop Dashboard preview
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'gamenet-dashboard.pid'
          if (Test-Path $pidFile) {
            $processId = Get-Content $pidFile | Select-Object -First 1
            if ($processId) { Stop-Process -Id ([int]$processId) -Force -ErrorAction SilentlyContinue }
            Remove-Item $pidFile -Force -ErrorAction SilentlyContinue
          }
