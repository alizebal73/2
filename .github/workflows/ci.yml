name: GameNet Manager CI

on:
  push:
    branches: [main, repair/ef-snapshot-and-preview]

concurrency:
  group: gamenet-ci-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check local .NET
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\dotnet\dotnet.exe')) {
            throw 'C:\dotnet\dotnet.exe not found on the self-hosted runner.'
          }
          & 'C:\dotnet\dotnet.exe' --info
          'C:\dotnet' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'DOTNET_ROOT=C:\dotnet' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Dashboard/package-lock.json

      - name: Restore .NET
        run: dotnet restore GameNetManager.sln

      - name: Build .NET
        run: dotnet build GameNetManager.sln --no-restore --configuration Release

      - name: Probe EF snapshot regeneration
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'src\Server\Data\Migrations'
          $snapshot = Join-Path $root 'GameNetDbContextModelSnapshot.cs'
          $backup = Join-Path $env:RUNNER_TEMP 'GameNetDbContextModelSnapshot.bak'
          $probe = Join-Path $root '__SnapshotProbe'
          $factory = Join-Path $env:GITHUB_WORKSPACE 'src\Server\DesignTimeDbContextFactory.cs'
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'ef-snapshot-probe'
          $log = Join-Path $artifact 'probe.log'
          $success = $false

          New-Item -ItemType Directory -Force $artifact | Out-Null
          if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }
          if (Test-Path $backup) { Remove-Item $backup -Force }
          if (Test-Path $factory) { Remove-Item $factory -Force }

          $factoryLines = @(
            'using GameNetManager.Server.Data;',
            'using Microsoft.EntityFrameworkCore;',
            'using Microsoft.EntityFrameworkCore.Design;',
            '',
            'public sealed class DesignTimeDbContextFactory : IDesignTimeDbContextFactory<GameNetDbContext>',
            '{',
            '    public GameNetDbContext CreateDbContext(string[] args)',
            '    {',
            '        var options = new DbContextOptionsBuilder<GameNetDbContext>()',
            '            .UseSqlite("Data Source=:memory:")',
            '            .Options;',
            '        return new GameNetDbContext(options);',
            '    }',
            '}'
          )
          Set-Content -Path $factory -Value $factoryLines -Encoding utf8
          Move-Item $snapshot $backup

          try {
            New-Item -ItemType Directory -Force $probe | Out-Null
            dotnet tool restore *>&1 | Tee-Object -FilePath $log -Append
            dotnet build src\Server\GameNetManager.Server.csproj --no-restore --configuration Release *>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -eq 0) {
              dotnet tool run dotnet-ef migrations add SnapshotRebuildProbe --project src\Server --startup-project src\Server --output-dir Data\Migrations\__SnapshotProbe --configuration Release --no-build *>&1 | Tee-Object -FilePath $log -Append
              if ($LASTEXITCODE -eq 0) {
                $generated = Get-ChildItem $probe -Filter '*ModelSnapshot.cs' | Select-Object -First 1
                if ($generated) {
                  Copy-Item $generated.FullName (Join-Path $artifact 'GameNetDbContextModelSnapshot.cs') -Force
                  $success = $true
                }
              }
            }
          } catch {
            $_ | Out-String | Add-Content $log
          } finally {
            if (Test-Path $snapshot) { Remove-Item $snapshot -Force }
            if (Test-Path $backup) { Move-Item $backup $snapshot -Force }
            if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }
            if (Test-Path $factory) { Remove-Item $factory -Force }
          }

          "SNAPSHOT_PROBE_SUCCESS=$success" | Add-Content $log
          if (-not $success) { Write-Warning 'EF snapshot probe did not generate a replacement snapshot. Existing snapshot was restored unchanged.' }

      - name: Upload EF snapshot probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ef-snapshot-probe
          path: ef-snapshot-probe
          if-no-files-found: error
      - name: Test .NET
        run: dotnet test GameNetManager.sln --no-build --configuration Release

      - name: Install Dashboard
        run: npm ci --prefix src/Dashboard

      - name: Lint Dashboard
        run: npm run lint --prefix src/Dashboard

      - name: Build Dashboard
        run: npm run build --prefix src/Dashboard

      - name: Start Dashboard preview
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'npm.cmd' -ArgumentList @('run','preview','--prefix','src/Dashboard','--','--host','127.0.0.1','--port','4173') -PassThru
          $process.Id | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'gamenet-dashboard.pid') -Encoding utf8
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $response) { throw 'Dashboard preview did not start on port 4173.' }

      - name: Install Dashboard browser test dependency
        shell: pwsh
        run: npm install --prefix src/Dashboard --no-save --no-package-lock @playwright/test@1.63.0

      - name: Dashboard interaction smoke
        shell: pwsh
        run: |
          $env:NODE_PATH = Join-Path $env:GITHUB_WORKSPACE 'src\Dashboard\node_modules'
          npx --prefix src/Dashboard playwright test --config "$env:GITHUB_WORKSPACE\e2e\playwright.config.cjs" --workers=1

      - name: Stop Dashboard preview
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'gamenet-dashboard.pid'
          if (Test-Path $pidFile) {
            $processId = Get-Content $pidFile | Select-Object -First 1
            if ($processId) { Stop-Process -Id ([int]$processId) -Force -ErrorAction SilentlyContinue }
            Remove-Item $pidFile -Force -ErrorAction SilentlyContinue
          }
