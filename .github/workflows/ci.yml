name: GameNet Manager CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gamenet-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check local .NET
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\dotnet\dotnet.exe')) {
            throw 'C:\dotnet\dotnet.exe not found on the self-hosted runner.'
          }
          & 'C:\dotnet\dotnet.exe' --info
          'C:\dotnet' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'DOTNET_ROOT=C:\dotnet' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Dashboard/package-lock.json

      - name: Restore .NET
        run: dotnet restore GameNetManager.sln

      - name: Build .NET
        run: dotnet build GameNetManager.sln --no-restore --configuration Release

      - name: Test .NET
        run: dotnet test GameNetManager.sln --no-build --configuration Release

      - name: Validate EF model snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global dotnet-ef --version 10.0.12 --ignore-failed-sources
          $env:PATH = "$env:USERPROFILE\\.dotnet\\tools;$env:PATH"
          dotnet ef migrations has-pending-model-changes --project src/Server/GameNetManager.Server.csproj --startup-project src/Server/GameNetManager.Server.csproj --context GameNetDbContext --verbose
          # Optional probe: an empty scaffolded migration is valid and must not fail CI.
          $probeDir = 'src/Server/Data/Migrations/__Stage12ModelProbe'
          Remove-Item $probeDir -Recurse -Force -ErrorAction SilentlyContinue
          dotnet ef migrations add Stage12ModelProbe --project src/Server/GameNetManager.Server.csproj --startup-project src/Server/GameNetManager.Server.csproj --output-dir Data/Migrations/__Stage12ModelProbe --context GameNetDbContext --no-build
          $probeMigration = Get-ChildItem $probeDir -Filter '????????????????_Stage12ModelProbe.cs' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($probeMigration) {
            $probeText = Get-Content $probeMigration.FullName -Raw
            if ($probeText -match 'migrationBuilder\.(Add|Alter|Drop|Create|Rename|Sql)') {
              Write-Host 'Unexpected model-diff migration was scaffolded:'
              git diff -- src/Server/Data/Migrations/GameNetDbContextModelSnapshot.cs
              Write-Host ("===== " + $probeMigration.FullName + " =====")
              Get-Content $probeMigration.FullName
              git checkout -- src/Server/Data/Migrations/GameNetDbContextModelSnapshot.cs
              Remove-Item $probeDir -Recurse -Force -ErrorAction SilentlyContinue
              throw 'EF model snapshot has pending changes.'
            }
          }
          git checkout -- src/Server/Data/Migrations/GameNetDbContextModelSnapshot.cs
          Remove-Item $probeDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Rebuild .NET after EF validation
        run: dotnet build GameNetManager.sln --no-restore --configuration Release

      - name: Server startup and migration smoke
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP 'gamenet-server-smoke.db'
          $stdout = Join-Path $env:RUNNER_TEMP 'gamenet-server-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'gamenet-server-smoke.stderr.log'
          Remove-Item $db,$stdout,$stderr -Force -ErrorAction SilentlyContinue

          $port = 15080
          while (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) {
            $port++
            if ($port -gt 15980) { throw 'No free Server smoke port is available.' }
          }
          $baseUrl = "http://127.0.0.1:$port"

          $env:ASPNETCORE_ENVIRONMENT = 'Development'
          $env:ASPNETCORE_URLS = $baseUrl
          $env:Database__FileName = $db
          $env:Agent__RegistrationToken = 'Stage8CiRegistrationToken!'
          $env:Agent__HeartbeatIntervalSeconds = '3'
          $env:Agent__OfflineAfterSeconds = '6'
          $env:Agent__CommandTimeoutSeconds = '5'
          $env:Agent__UpdateCommandTimeoutSeconds = '120'
          $env:Agent__RollbackCommandTimeoutSeconds = '60'

          $releaseRoot = Join-Path $env:RUNNER_TEMP 'gamenet-stage10-release'
          $releaseClient = Join-Path $releaseRoot 'client'
          $releasePackage = Join-Path $releaseRoot 'GameNetManager.Client-0.7.1.zip'
          Remove-Item $releaseRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $releaseClient -Force | Out-Null
          dotnet publish src/Client/GameNetManager.Client.csproj --configuration Release --output $releaseClient --no-restore
          '0.7.1' | Out-File -FilePath (Join-Path $releaseClient 'client-version.txt') -Encoding ascii
          Compress-Archive -Path (Join-Path $releaseClient '*') -DestinationPath $releasePackage -Force
          $releaseHash = (Get-FileHash -Algorithm SHA256 -Path $releasePackage).Hash.ToLowerInvariant()
          $env:App__ClientPackageVersion = '0.7.1'
          $env:App__ClientPackagePath = $releasePackage
          $env:App__ClientPackageSha256 = $releaseHash

          $process = Start-Process -FilePath 'dotnet' -ArgumentList @(
            'run','--no-build','--configuration','Release',
            '--project','src\Server\GameNetManager.Server.csproj',
            '--no-launch-profile'
          ) -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($process.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri "$baseUrl/api/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              Write-Host '--- Server stdout ---'
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host '--- Server stderr ---'
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Server did not reach /api/health on port 5080.'
            }
            Write-Host 'Server startup, EF migrations and /api/health passed.'


            $adminSession = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $adminLogin = Invoke-RestMethod -Uri "$baseUrl/api/auth/login" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              userName = 'admin'
              password = '123456'
            } | ConvertTo-Json)
            if (-not $adminLogin.id -or $adminLogin.role -ne 'Admin') { throw 'Server operator authentication smoke failed before Agent smoke.' }

            $meBeforeAgent = Invoke-RestMethod -Uri "$baseUrl/api/auth/me" -Method Get -WebSession $adminSession
            if ($meBeforeAgent.userName -ne 'admin') { throw 'Current operator endpoint failed before Agent smoke.' }

            # Stage 11: prove Game and Account Pool are server-backed and allocation is atomic.
            $stage11Game = Invoke-RestMethod -Uri "$baseUrl/api/games" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              name = 'CI Stage11 Game'
              version = '1.0'
              genre = 'CI'
              status = 'online'
              path = 'C:\\Games\\Stage11'
              executable = 'Stage11.exe'
              cover = ''
              trailer = ''
              launchArgs = ''
              connectionType = 'آنلاین'
              active = $true
              targetSystem = 'all'
              target = 'all'
              targetZone = 'pc'
              targetStations = ''
            } | ConvertTo-Json)
            if (-not $stage11Game.id) { throw 'Stage 11 Game create smoke failed.' }

            $stage11GameList = Invoke-RestMethod -Uri "$baseUrl/api/games" -Method Get -WebSession $adminSession
            if (-not (@($stage11GameList | Where-Object { $_.id -eq $stage11Game.id })).Count) { throw 'Stage 11 Game list smoke failed.' }

            $stage11GameUpdated = Invoke-RestMethod -Uri "$baseUrl/api/games/$($stage11Game.id)" -Method Put -WebSession $adminSession -ContentType 'application/json' -Body (@{
              name = 'CI Stage11 Game'
              version = '1.1'
              genre = 'CI'
              status = 'online'
              path = 'C:\Games\Stage11'
              executable = 'Stage11.exe'
              cover = ''
              trailer = ''
              launchArgs = '--stage11'
              connectionType = 'آنلاین'
              active = $true
              targetSystem = 'all'
              target = 'all'
              targetZone = 'pc'
              targetStations = ''
            } | ConvertTo-Json)
            if ($stage11GameUpdated.version -ne '1.1' -or $stage11GameUpdated.launchArgs -ne '--stage11') { throw 'Stage 11 Game update smoke failed.' }

            $stage11GameListAfterUpdate = Invoke-RestMethod -Uri "$baseUrl/api/games" -Method Get -WebSession $adminSession
            $stage11GameAfterUpdate = @($stage11GameListAfterUpdate | Where-Object { $_.id -eq $stage11Game.id })[0]
            if (-not $stage11GameAfterUpdate -or $stage11GameAfterUpdate.version -ne '1.1') { throw 'Stage 11 Game update/list consistency smoke failed.' }

            $stage11CreateResponse = Invoke-RestMethod -Uri "$baseUrl/api/account-pool" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              title = 'CI Stage11 Account'
              platform = 'Steam'
              login = 'ci-stage11'
              secret = 'Stage11Secret!'
              owner = 'CI'
              expiresAt = $null
              allowedGameIds = @($stage11Game.id)
              status = 'Free'
            } | ConvertTo-Json)

            $stage11AccountId = [string]$stage11CreateResponse.id
            if ([string]::IsNullOrWhiteSpace($stage11AccountId)) { throw 'Stage 11 Account Pool create smoke failed: no account id returned.' }

            $stage11AccountPool = Invoke-RestMethod -Uri "$baseUrl/api/account-pool" -Method Get -WebSession $adminSession
            $stage11Account = @($stage11AccountPool | Where-Object { $_.id -eq $stage11AccountId })[0]
            if (-not $stage11Account -or $stage11Account.login -ne 'ci-stage11') { throw 'Stage 11 Account Pool create/list smoke failed.' }

            Invoke-RestMethod -Uri "$baseUrl/api/account-pool/$stage11AccountId" -Method Put -WebSession $adminSession -ContentType 'application/json' -Body (@{
              title = 'CI Stage11 Account'
              platform = 'Steam'
              login = 'ci-stage11-updated'
              secret = $null
              owner = 'CI'
              expiresAt = $null
              allowedGameIds = @($stage11Game.id)
              status = 'Locked'
            } | ConvertTo-Json) | Out-Null

            Invoke-RestMethod -Uri "$baseUrl/api/account-pool/$stage11AccountId/unlock" -Method Post -WebSession $adminSession | Out-Null
            $stage11AccountAfterUpdate = @((Invoke-RestMethod -Uri "$baseUrl/api/account-pool" -Method Get -WebSession $adminSession) | Where-Object { $_.id -eq $stage11AccountId })[0]
            if (-not $stage11AccountAfterUpdate -or $stage11AccountAfterUpdate.login -ne 'ci-stage11-updated' -or $stage11AccountAfterUpdate.status -ne 'Free') { throw 'Stage 11 Account Pool update/unlock smoke failed.' }

            $stage11Lease = Invoke-RestMethod -Uri "$baseUrl/api/account-pool/allocate" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              gameId = $stage11Game.id
              agentDeviceId = $null
              customerId = $null
              sessionId = $null
            } | ConvertTo-Json)
            if (-not $stage11Lease.leaseId) { throw 'Stage 11 Account allocation smoke failed.' }

            $stage11InUsePool = Invoke-RestMethod -Uri "$baseUrl/api/account-pool" -Method Get -WebSession $adminSession
            $stage11InUse = @($stage11InUsePool | Where-Object { $_.id -eq $stage11AccountId })[0]
            if (-not $stage11InUse -or $stage11InUse.status -ne 'InUse') { throw 'Stage 11 Account Pool allocation state was not visible as InUse.' }

            Invoke-RestMethod -Uri "$baseUrl/api/account-pool/leases/$($stage11Lease.leaseId)/release" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{ reason = 'CI Stage11 smoke' } | ConvertTo-Json) | Out-Null

            $stage11FreePool = Invoke-RestMethod -Uri "$baseUrl/api/account-pool" -Method Get -WebSession $adminSession
            $stage11Free = @($stage11FreePool | Where-Object { $_.id -eq $stage11AccountId })[0]
            if (-not $stage11Free -or $stage11Free.status -ne 'Free') { throw 'Stage 11 Account Pool release state was not visible as Free.' }

            Invoke-RestMethod -Uri "$baseUrl/api/games/$($stage11Game.id)" -Method Delete -WebSession $adminSession | Out-Null
            Write-Host 'Stage 11 Game CRUD + Account Pool CRUD/unlock + allocate -> release -> archive smoke passed.'

            # Stage 8: prove a real Client Agent can register, connect to the dedicated SignalR hub,
            # persist a heartbeat, and become offline again after disconnect.
            $agentData = Join-Path $env:RUNNER_TEMP 'gamenet-stage8-agent'
            $agentStdout = Join-Path $env:RUNNER_TEMP 'gamenet-stage8-agent.stdout.log'
            $agentStderr = Join-Path $env:RUNNER_TEMP 'gamenet-stage8-agent.stderr.log'
            Remove-Item $agentData,$agentStdout,$agentStderr -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $agentData -Force | Out-Null

            $env:GAMENET_SERVER_URL = $baseUrl
            $env:GAMENET_AGENT_REGISTRATION_TOKEN = 'Stage8CiRegistrationToken!'
            $env:GAMENET_AGENT_NAME = 'CI Agent Stage 8'
            $env:GAMENET_AGENT_DATA_DIR = $agentData
            $env:GAMENET_AGENT_HEADLESS = '1'

            $agentProcess = Start-Process -FilePath 'dotnet' -ArgumentList @(
              'src/Client/bin/Release/net10.0-windows/GameNetManager.Client.dll'
            ) -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $agentStdout -RedirectStandardError $agentStderr

            try {
              $agentOnline = $false
              $agentRow = $null
              for ($i = 0; $i -lt 30; $i++) {
                if ($agentProcess.HasExited) { break }
                try {
                  $agentRows = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
                  $agentRow = @($agentRows | Where-Object { $_.name -eq 'CI Agent Stage 8' })[0]
                  if ($agentRow -and $agentRow.isOnline -and $agentRow.lastSeenAt) {
                    $agentOnline = $true
                    break
                  }
                } catch {}
                Start-Sleep -Seconds 1
              }

              if (-not $agentOnline) {
                Write-Host ("Agent process exited: {0}; exit code: {1}" -f $agentProcess.HasExited, $agentProcess.ExitCode)
                Write-Host '--- Agent stdout ---'
                if (Test-Path $agentStdout) { Get-Content $agentStdout }
                Write-Host '--- Agent stderr ---'
                if (Test-Path $agentStderr) { Get-Content $agentStderr }
                if (Test-Path (Join-Path $agentData 'agent-state.json')) {
                  $agentState = Get-Content (Join-Path $agentData 'agent-state.json') | ConvertFrom-Json
                  Write-Host ("Agent state persisted: DeviceId={0}; Name={1}; StationId={2}; HasToken={3}" -f $agentState.DeviceId, $agentState.Name, $agentState.StationId, (-not [string]::IsNullOrWhiteSpace($agentState.AgentToken)))
                }
                Write-Host '--- Server Agent rows ---'
                try {
                  $currentAgentRows = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
                  $currentAgentRows | ConvertTo-Json -Depth 5
                } catch {
                  Write-Host ("Agent status API failed: {0}" -f $_.Exception.Message)
                }
                Write-Host '--- Server stdout ---'
                if (Test-Path $stdout) { Get-Content $stdout }
                Write-Host '--- Server stderr ---'
                if (Test-Path $stderr) { Get-Content $stderr }
                try {
                  $health = Invoke-WebRequest -Uri "$baseUrl/api/health" -UseBasicParsing -TimeoutSec 2
                  Write-Host ("Server health after Agent failure: {0}" -f $health.StatusCode)
                } catch {
                  Write-Host ("Server health failed after Agent failure: {0}" -f $_.Exception.Message)
                }
                throw 'Stage 8 Agent did not register/connect and publish an online heartbeat.'
              }

              Write-Host ("Stage 8 Agent heartbeat smoke passed: deviceId={0}; lastSeen={1}" -f $agentRow.deviceId, $agentRow.lastSeenAt)

              $lifecycleStatus = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($agentRow.agentId)/lifecycle" -Method Get -WebSession $adminSession
              if ($lifecycleStatus.lifecycleState -ne 'Running') {
                throw "Agent lifecycle state was not Running after healthy connection: $($lifecycleStatus.lifecycleState)"
              }
              if (-not $lifecycleStatus.compatibility.compatible) {
                throw 'Agent release compatibility smoke failed for the current client.'
              }
              Write-Host ("Stage 10 lifecycle compatibility smoke passed: state={0}; compatible={1}; recommended={2}" -f $lifecycleStatus.lifecycleState, $lifecycleStatus.compatibility.compatible, $lifecycleStatus.compatibility.updateRecommended)

              # Release Safety / Canary gate: exactly one online CI Agent plus a server-authoritative release manifest.
              if (@($agentRows | Where-Object { $_.isOnline }).Count -ne 1) { throw 'Canary gate requires exactly one online Agent target.' }
              $releaseManifest = Invoke-RestMethod -Uri "$baseUrl/api/release/manifest" -Method Get
              if (-not $releaseManifest.clientPackage) { throw 'Release manifest did not expose a Client package.' }
              if ($releaseManifest.clientPackage.version -ne $env:App__ClientPackageVersion) { throw 'Release manifest package version does not match the configured package.' }
              if ([int64]$releaseManifest.clientPackage.sizeBytes -ne (Get-Item $env:App__ClientPackagePath).Length) { throw 'Release manifest package size does not match the package on Server.' }
              if ($releaseManifest.clientPackage.sha256 -ne $env:App__ClientPackageSha256) { throw 'Release manifest package hash does not match the package on Server.' }
              Write-Host ("Stage 10 release safety/canary manifest gate passed: target={0}; version={1}" -f $agentRow.deviceId, $releaseManifest.clientPackage.version)

              $baselineAgentVersion = $agentRow.agentVersion
              $updatePayload = @{
                commandType = 'update'
                payloadJson = (@{
                  version = '0.7.1'
                  packageUrl = "$baseUrl/api/release/client-package?version=0.7.1"
                  sha256 = $env:App__ClientPackageSha256
                  sizeBytes = (Get-Item $env:App__ClientPackagePath).Length
                  activate = $true
                } | ConvertTo-Json -Compress)
              } | ConvertTo-Json -Compress

              $updateCommand = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($agentRow.agentId)/commands" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body $updatePayload
              $updateCompleted = $false
              $updateStatus = $null
              for ($i = 0; $i -lt 240; $i++) {
                $updateStatus = Invoke-RestMethod -Uri "$baseUrl/api/agent/commands/$($updateCommand.commandId)" -Method Get -WebSession $adminSession
                if ($updateStatus.status -in @('Succeeded','Failed')) { $updateCompleted = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (-not $updateCompleted -or $updateStatus.status -ne 'Succeeded') {
                Write-Host ("Stage 10 update command did not complete. Status={0}; Result={1}" -f $updateStatus.status, $updateStatus.resultMessage)
                Write-Host '--- Agent stdout before update failure ---'
                if (Test-Path $agentStdout) { Get-Content $agentStdout }
                Write-Host '--- Agent stderr before update failure ---'
                if (Test-Path $agentStderr) { Get-Content $agentStderr }
                Write-Host '--- Server stdout before update failure ---'
                if (Test-Path $stdout) { Get-Content $stdout }
                Write-Host '--- Server stderr before update failure ---'
                if (Test-Path $stderr) { Get-Content $stderr }
                throw 'Stage 10 update command did not complete successfully.'
              }
              Write-Host ("Stage 10 update command succeeded: commandId={0}" -f $updateCommand.commandId)

              $updatedAgent = $null
              $updatedReady = $false
              for ($i = 0; $i -lt 45; $i++) {
                try {
                  $agentRowsAfterUpdate = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
                  $updatedAgent = @($agentRowsAfterUpdate | Where-Object { $_.agentId -eq $agentRow.agentId })[0]
                  if ($updatedAgent -and $updatedAgent.isOnline -and $updatedAgent.lifecycleState -eq 'Running' -and $updatedAgent.agentVersion -eq '0.7.1') {
                    $updatedReady = $true
                    break
                  }
                } catch {}
                Start-Sleep -Seconds 1
              }
              if (-not $updatedReady) {
                throw "Stage 10 update did not restart into the new healthy version. Current=$($updatedAgent | ConvertTo-Json -Depth 5 -Compress)"
              }

              $updatedLifecycle = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($agentRow.agentId)/lifecycle" -Method Get -WebSession $adminSession
              if (-not $updatedLifecycle.compatibility.compatible -or $updatedLifecycle.lifecycleState -ne 'Running') {
                throw 'Stage 10 updated client failed release compatibility or healthy lifecycle checks.'
              }

              $rollbackCommand = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($agentRow.agentId)/rollback" -Method Post -WebSession $adminSession | ConvertTo-Json -Compress
              $rollbackCommand = $rollbackCommand | ConvertFrom-Json
              $rollbackCompleted = $false
              $rollbackStatus = $null
              for ($i = 0; $i -lt 120; $i++) {
                $rollbackStatus = Invoke-RestMethod -Uri "$baseUrl/api/agent/commands/$($rollbackCommand.commandId)" -Method Get -WebSession $adminSession
                if ($rollbackStatus.status -in @('Succeeded','Failed')) { $rollbackCompleted = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (-not $rollbackCompleted -or $rollbackStatus.status -ne 'Succeeded') {
                Write-Host ("Stage 10 rollback command failed/timeout. Completed={0}; Status={1}; Succeeded={2}; Result={3}" -f $rollbackCompleted, $rollbackStatus.status, $rollbackStatus.succeeded, $rollbackStatus.resultMessage)
                Write-Host '--- Agent stdout after rollback command failure ---'
                if (Test-Path $agentStdout) { Get-Content $agentStdout }
                Write-Host '--- Agent stderr after rollback command failure ---'
                if (Test-Path $agentStderr) { Get-Content $agentStderr }
                Write-Host '--- Persisted Agent state after rollback command failure ---'
                $agentStatePath = Join-Path $agentData 'agent-state.json'
                if (Test-Path $agentStatePath) { Get-Content $agentStatePath }
                Write-Host '--- Update state after rollback command failure ---'
                $updateStatePath = Join-Path $agentData 'update-active.json'
                if (Test-Path $updateStatePath) { Get-Content $updateStatePath }
                $rollbackObservedStatus = if ($null -eq $rollbackStatus) { '<null>' } else { [string]$rollbackStatus.status }
                $rollbackObservedSucceeded = if ($null -eq $rollbackStatus) { '<null>' } else { [string]$rollbackStatus.succeeded }
                $rollbackObservedResult = if ($null -eq $rollbackStatus -or $null -eq $rollbackStatus.resultMessage) { '<null>' } else { [string]$rollbackStatus.resultMessage }
                throw "Stage 10 rollback command did not complete successfully. Completed=$rollbackCompleted Status=$rollbackObservedStatus Succeeded=$rollbackObservedSucceeded Result=$rollbackObservedResult"
              }

              $rollbackReady = $false
              $rolledBackAgent = $null
              for ($i = 0; $i -lt 45; $i++) {
                try {
                  $rollbackRows = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
                  $rolledBackAgent = @($rollbackRows | Where-Object { $_.agentId -eq $agentRow.agentId })[0]
                  if ($rolledBackAgent -and $rolledBackAgent.isOnline -and $rolledBackAgent.lifecycleState -eq 'Running' -and $rolledBackAgent.agentVersion -eq $baselineAgentVersion) {
                    $rollbackReady = $true
                    break
                  }
                } catch {}
                Start-Sleep -Seconds 1
              }
              if (-not $rollbackReady) {
                Write-Host '--- Agent stdout after rollback failure ---'
                if (Test-Path $agentStdout) { Get-Content $agentStdout }
                Write-Host '--- Agent stderr after rollback failure ---'
                if (Test-Path $agentStderr) { Get-Content $agentStderr }
                Write-Host '--- Persisted Agent state after rollback failure ---'
                $agentStatePath = Join-Path $agentData 'agent-state.json'
                if (Test-Path $agentStatePath) { Get-Content $agentStatePath }
                Write-Host '--- Update state after rollback failure ---'
                $updateStatePath = Join-Path $agentData 'update-active.json'
                if (Test-Path $updateStatePath) { Get-Content $updateStatePath }
                Write-Host '--- Server Agent row after rollback failure ---'
                if ($rolledBackAgent) { $rolledBackAgent | ConvertTo-Json -Depth 5 }
                throw "Stage 10 rollback did not restore the previous healthy version. Current=$($rolledBackAgent | ConvertTo-Json -Depth 5 -Compress)"
              }

              Write-Host ("Stage 10 update and rollback smoke passed: baseline={0}; updated=0.7.1; restored={1}" -f $baselineAgentVersion, $rolledBackAgent.agentVersion)
            }
            finally {
              if (-not $agentProcess.HasExited) {
                Stop-Process -Id $agentProcess.Id -Force -ErrorAction SilentlyContinue
              }

              $agentDataPattern = [regex]::Escape($agentData)
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  ($_.ProcessId -ne $PID) -and $_.CommandLine -and ($_.CommandLine -match $agentDataPattern)
                } |
                ForEach-Object {
                  Stop-Process -Id ([int]$_.ProcessId) -Force -ErrorAction SilentlyContinue
                }

              Start-Sleep -Seconds 2
            }

            $offlineRow = $null
            $offlineReady = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $offlineRows = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
                $offlineRow = @($offlineRows | Where-Object { $_.name -eq 'CI Agent Stage 8' })[0]
                if ($offlineRow -and -not $offlineRow.isOnline) {
                  $offlineReady = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }

            if (-not $offlineReady) {
              Write-Host '--- Agent stdout ---'
              if (Test-Path $agentStdout) { Get-Content $agentStdout }
              Write-Host '--- Agent stderr ---'
              if (Test-Path $agentStderr) { Get-Content $agentStderr }
              throw 'Stage 8 Agent did not transition to offline after disconnect.'
            }

            $offlineLifecycle = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($offlineRow.agentId)/lifecycle" -Method Get -WebSession $adminSession
            if ($offlineLifecycle.lifecycleState -ne 'Degraded') {
              throw "Agent lifecycle state was not Degraded after offline transition: $($offlineLifecycle.lifecycleState)"
            }
            Write-Host ("Stage 10 degraded lifecycle smoke passed: state={0}" -f $offlineLifecycle.lifecycleState)

            Write-Host 'Stage 8 Agent registration, SignalR connection, heartbeat and offline transition smoke passed.'

            # Restart from the persisted Agent state without the bootstrap registration token.
            $firstDeviceId = $offlineRow.deviceId
            $env:GAMENET_AGENT_REGISTRATION_TOKEN = $null
            $secondAgentStdout = Join-Path $env:RUNNER_TEMP 'gamenet-stage8-agent-second.stdout.log'
            $secondAgentStderr = Join-Path $env:RUNNER_TEMP 'gamenet-stage8-agent-second.stderr.log'
            Remove-Item $secondAgentStdout,$secondAgentStderr -Force -ErrorAction SilentlyContinue

            $secondAgentProcess = Start-Process -FilePath 'dotnet' -ArgumentList @(
              'src/Client/bin/Release/net10.0-windows/GameNetManager.Client.dll'
            ) -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $secondAgentStdout -RedirectStandardError $secondAgentStderr

            try {
              $secondOnline = $false
              $secondRow = $null
              for ($i = 0; $i -lt 30; $i++) {
                if ($secondAgentProcess.HasExited) { break }
                try {
                  $secondRows = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
                  $secondRow = @($secondRows | Where-Object { $_.name -eq 'CI Agent Stage 8' })[0]
                  if ($secondRow -and $secondRow.isOnline -and $secondRow.lastSeenAt) {
                    $secondOnline = $true
                    break
                  }
                } catch {}
                Start-Sleep -Seconds 1
              }

              if (-not $secondOnline) {
                Write-Host '--- Second Agent stdout ---'
                if (Test-Path $secondAgentStdout) { Get-Content $secondAgentStdout }
                Write-Host '--- Second Agent stderr ---'
                if (Test-Path $secondAgentStderr) { Get-Content $secondAgentStderr }
                throw 'Persisted Agent identity could not reconnect without the bootstrap registration token.'
              }

              if ($secondRow.deviceId -ne $firstDeviceId) {
                throw "Agent identity changed after restart: first=$firstDeviceId second=$($secondRow.deviceId)"
              }

              Write-Host ("Stage 8 Agent persisted identity smoke passed: deviceId={0}" -f $secondRow.deviceId)

              $recoveredLifecycle = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($secondRow.agentId)/lifecycle" -Method Get -WebSession $adminSession
              if ($recoveredLifecycle.lifecycleState -ne 'Running' -or -not $recoveredLifecycle.lastHealthyAt) {
                Write-Host '--- Recovery lifecycle response ---'
                $recoveredLifecycle | ConvertTo-Json -Depth 5
                Write-Host '--- Second Agent stdout ---'
                if (Test-Path $secondAgentStdout) { Get-Content $secondAgentStdout }
                Write-Host '--- Second Agent stderr ---'
                if (Test-Path $secondAgentStderr) { Get-Content $secondAgentStderr }
                Write-Host '--- Persisted second Agent state ---'
                $secondAgentStatePath = Join-Path $agentData 'agent-state.json'
                if (Test-Path $secondAgentStatePath) { Get-Content $secondAgentStatePath }
                Write-Host '--- Server Agent rows at recovery failure ---'
                try {
                  Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession | ConvertTo-Json -Depth 8
                } catch {}
                Write-Host '--- Server stdout at recovery failure ---'
                if (Test-Path $stdout) { Get-Content $stdout }
                Write-Host '--- Server stderr at recovery failure ---'
                if (Test-Path $stderr) { Get-Content $stderr }
                throw "Agent lifecycle did not recover to Running with a healthy timestamp: $($recoveredLifecycle.lifecycleState)"
              }
              Write-Host ("Stage 10 recovery lifecycle smoke passed: state={0}; lastHealthyAt={1}" -f $recoveredLifecycle.lifecycleState, $recoveredLifecycle.lastHealthyAt)

              $clientIdentity = Invoke-RestMethod -Uri "$baseUrl/api/client/identity" -Method Get
              if ($clientIdentity.deviceId -ne $secondRow.deviceId -or -not $clientIdentity.isOnline) {
                $clientIdentity | ConvertTo-Json -Depth 5
                throw 'Client identity endpoint did not resolve the local Agent device.'
              }
              Write-Host ("Stage 9 Client identity discovery smoke passed: deviceId={0}; stationId={1}" -f $clientIdentity.deviceId, $clientIdentity.stationId)

              $commandRequestBody = @{
                commandType = 'ping'
                payloadJson = $null
              } | ConvertTo-Json
              $command = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($secondRow.agentId)/commands" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body $commandRequestBody
              if (-not $command.commandId -or $command.status -ne 'Sent') {
                throw 'Stage 8 Agent command dispatch did not return a sent command.'
              }

              $commandCompleted = $false
              $commandStatus = $null
              for ($i = 0; $i -lt 20; $i++) {
                try {
                  $commandStatus = Invoke-RestMethod -Uri "$baseUrl/api/agent/commands/$($command.commandId)" -Method Get -WebSession $adminSession
                  if ($commandStatus.status -in @('Succeeded', 'Failed')) {
                    $commandCompleted = $true
                    break
                  }
                } catch {}
                Start-Sleep -Milliseconds 500
              }

              if (-not $commandCompleted -or $commandStatus.status -ne 'Succeeded' -or $commandStatus.succeeded -ne $true) {
                Write-Host '--- Second Agent stdout after command ---'
                if (Test-Path $secondAgentStdout) { Get-Content $secondAgentStdout }
                Write-Host '--- Second Agent stderr after command ---'
                if (Test-Path $secondAgentStderr) { Get-Content $secondAgentStderr }
                Write-Host '--- Command status ---'
                if ($commandStatus) { $commandStatus | ConvertTo-Json -Depth 5 }
                throw 'Stage 8 Agent ping command was not acknowledged successfully.'
              }

              Write-Host ("Stage 8 Agent command transport smoke passed: commandId={0}; result={1}" -f $commandStatus.commandId, $commandStatus.resultMessage)

              $lockCommand = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($secondRow.agentId)/commands" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
                commandType = 'lock'
                payloadJson = $null
              } | ConvertTo-Json)
              if ($lockCommand.status -ne 'Sent') { throw 'Agent lock command was not accepted for dispatch.' }

              $lockCompleted = $false
              $lockStatus = $null
              for ($i = 0; $i -lt 20; $i++) {
                $lockStatus = Invoke-RestMethod -Uri "$baseUrl/api/agent/commands/$($lockCommand.commandId)" -Method Get -WebSession $adminSession
                if ($lockStatus.status -in @('Succeeded', 'Failed')) { $lockCompleted = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (-not $lockCompleted -or $lockStatus.status -ne 'Succeeded') {
                throw 'Agent lock command did not complete successfully.'
              }

              $lockedRows = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
              $lockedRow = @($lockedRows | Where-Object { $_.agentId -eq $secondRow.agentId })[0]
              if (-not $lockedRow.isLocked) { throw 'Agent lock acknowledgement did not persist IsLocked=true.' }

              $unlockCommand = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($secondRow.agentId)/commands" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
                commandType = 'unlock'
                payloadJson = $null
              } | ConvertTo-Json)
              if ($unlockCommand.status -ne 'Sent') { throw 'Agent unlock command was not accepted for dispatch.' }

              $unlockCompleted = $false
              $unlockStatus = $null
              for ($i = 0; $i -lt 20; $i++) {
                $unlockStatus = Invoke-RestMethod -Uri "$baseUrl/api/agent/commands/$($unlockCommand.commandId)" -Method Get -WebSession $adminSession
                if ($unlockStatus.status -in @('Succeeded', 'Failed')) { $unlockCompleted = $true; break }
                Start-Sleep -Milliseconds 500
              }
              if (-not $unlockCompleted -or $unlockStatus.status -ne 'Succeeded') {
                throw 'Agent unlock command did not complete successfully.'
              }

              $unlockedRows = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
              $unlockedRow = @($unlockedRows | Where-Object { $_.agentId -eq $secondRow.agentId })[0]
              if ($unlockedRow.isLocked) { throw 'Agent unlock acknowledgement did not persist IsLocked=false.' }

              Write-Host ("Stage 9 Agent lock/unlock smoke passed: agentId={0}" -f $secondRow.agentId)

              $policy = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($secondRow.agentId)/policy" -Method Put -WebSession $adminSession -ContentType 'application/json' -Body (@{
                kioskEnabled = $true
                lockOnDisconnect = $true
              } | ConvertTo-Json)
              if (-not $policy.kioskEnabled -or -not $policy.lockOnDisconnect) {
                throw 'Agent kiosk policy did not persist enabled safety settings.'
              }

              $policyRows = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
              $policyRow = @($policyRows | Where-Object { $_.agentId -eq $secondRow.agentId })[0]
              if (-not $policyRow.kioskEnabled -or -not $policyRow.lockOnDisconnect) {
                throw 'Agent status API did not expose persisted kiosk policy.'
              }

              $logoutLockCommand = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($secondRow.agentId)/commands" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
                commandType = 'logout-lock'
                payloadJson = $null
              } | ConvertTo-Json)
              if ($logoutLockCommand.status -ne 'Sent') {
                throw 'Agent logout-lock command was not accepted for dispatch.'
              }

              $logoutLockStatus = $null
              for ($i = 0; $i -lt 20; $i++) {
                $logoutLockStatus = Invoke-RestMethod -Uri "$baseUrl/api/agent/commands/$($logoutLockCommand.commandId)" -Method Get -WebSession $adminSession
                if ($logoutLockStatus.status -in @('Succeeded', 'Failed')) { break }
                Start-Sleep -Milliseconds 500
              }
              if ($logoutLockStatus.status -ne 'Succeeded') {
                throw 'Agent logout-lock command did not complete successfully.'
              }

              $logoutLockRows = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
              $logoutLockRow = @($logoutLockRows | Where-Object { $_.agentId -eq $secondRow.agentId })[0]
              if (-not $logoutLockRow.isLocked) {
                throw 'Agent logout-lock acknowledgement did not persist IsLocked=true.'
              }

              $unlockAfterLogoutLock = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($secondRow.agentId)/commands" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
                commandType = 'unlock'
                payloadJson = $null
              } | ConvertTo-Json)
              if ($unlockAfterLogoutLock.status -ne 'Sent') { throw 'Agent unlock after logout-lock was not accepted.' }

              for ($i = 0; $i -lt 20; $i++) {
                $unlockAfterLogoutStatus = Invoke-RestMethod -Uri "$baseUrl/api/agent/commands/$($unlockAfterLogoutLock.commandId)" -Method Get -WebSession $adminSession
                if ($unlockAfterLogoutStatus.status -in @('Succeeded', 'Failed')) { break }
                Start-Sleep -Milliseconds 500
              }
              if ($unlockAfterLogoutStatus.status -ne 'Succeeded') { throw 'Agent unlock after logout-lock did not complete.' }

              Invoke-RestMethod -Uri "$baseUrl/api/agent/devices/$($secondRow.agentId)/policy" -Method Put -WebSession $adminSession -ContentType 'application/json' -Body (@{
                kioskEnabled = $false
                lockOnDisconnect = $false
              } | ConvertTo-Json) | Out-Null

              Write-Host ("Stage 9 Agent kiosk policy and logout-lock smoke passed: agentId={0}" -f $secondRow.agentId)

              $multiProcesses = @()
              try {
                $multiAgentRoot = Join-Path $env:RUNNER_TEMP 'gamenet-stage8-multi-agent'
                New-Item -ItemType Directory -Path $multiAgentRoot -Force | Out-Null
                $multiNames = @('CI Agent Stage 8 B', 'CI Agent Stage 8 C')
                $multiStdout = @{}
                $multiStderr = @{}
                foreach ($multiName in $multiNames) {
                  $safe = ($multiName -replace '[^A-Za-z0-9]+','-').Trim('-').ToLowerInvariant()
                  $dir = Join-Path $multiAgentRoot $safe
                  New-Item -ItemType Directory -Path $dir -Force | Out-Null
                  $out = Join-Path $multiAgentRoot ($safe + '.stdout.log')
                  $err = Join-Path $multiAgentRoot ($safe + '.stderr.log')
                  $multiStdout[$multiName] = $out
                  $multiStderr[$multiName] = $err
                  $env:GAMENET_AGENT_REGISTRATION_TOKEN = 'Stage8CiRegistrationToken!'
                  $env:GAMENET_AGENT_NAME = $multiName
                  $env:GAMENET_AGENT_DATA_DIR = $dir
                  $multiProcesses += Start-Process -FilePath 'dotnet' -ArgumentList @(
                  'src/Client/bin/Release/net10.0-windows/GameNetManager.Client.dll'
                ) -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
                }

                $allMultiOnline = $false
              $multiRows = @()
                for ($i = 0; $i -lt 30; $i++) {
                  try {
                    $rows = Invoke-RestMethod -Uri "$baseUrl/api/agent/devices" -Method Get -WebSession $adminSession
                    $multiRows = @($rows | Where-Object { $_.name -in $multiNames })
                    if ($multiRows.Count -eq $multiNames.Count -and @($multiRows | Where-Object { $_.isOnline -and $_.lastSeenAt }).Count -eq $multiNames.Count) {
                      $allMultiOnline = $true
                      break
                    }
                  } catch {}
                  Start-Sleep -Seconds 1
                }

                if (-not $allMultiOnline) {
                  foreach ($multiName in $multiNames) {
                    Write-Host ("--- {0} stdout ---" -f $multiName)
                    if (Test-Path $multiStdout[$multiName]) { Get-Content $multiStdout[$multiName] }
                    Write-Host ("--- {0} stderr ---" -f $multiName)
                    if (Test-Path $multiStderr[$multiName]) { Get-Content $multiStderr[$multiName] }
                  }
                  throw 'Stage 8 multi-Agent concurrent online smoke failed.'
                }

                $multiDeviceIds = @($multiRows | Select-Object -ExpandProperty deviceId)
                if ($multiDeviceIds.Count -ne @($multiDeviceIds | Select-Object -Unique).Count) {
                  throw 'Stage 8 multi-Agent smoke detected duplicate device identities.'
                }

                Write-Host ("Stage 8 multi-Agent concurrency smoke passed: {0} agents online." -f $multiNames.Count)
              } finally {
                foreach ($process in $multiProcesses) {
                  if (-not $process.HasExited) {
                    Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                  }
                }
                $env:GAMENET_AGENT_REGISTRATION_TOKEN = $null
              }
            }
            finally {
              if (-not $secondAgentProcess.HasExited) {
                Stop-Process -Id $secondAgentProcess.Id -Force -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds 1
            }

            # Stage 9: real Agent-driven session start/end using customer authentication and the existing settlement domain.
            $sessionAgentRoot = Join-Path $env:RUNNER_TEMP 'gamenet-stage9-session-agent'
            $sessionAgentData = Join-Path $sessionAgentRoot 'data'
            $sessionAgentStdout = Join-Path $sessionAgentRoot 'stdout.log'
            $sessionAgentStderr = Join-Path $sessionAgentRoot 'stderr.log'
            Remove-Item $sessionAgentRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $sessionAgentData -Force | Out-Null

            $sessionDashboard = Invoke-RestMethod -Uri "$baseUrl/api/dashboard" -Method Get -WebSession $adminSession
            $sessionStation = @($sessionDashboard.stations | Where-Object { $_.type -eq 'PC' -and $_.state -eq 'Available' }) | Select-Object -First 1
            if (-not $sessionStation) {
              Write-Host '--- Available station snapshot ---'
              @($sessionDashboard.stations | Where-Object { $_.state -eq 'Available' } | Select-Object -First 10) | ConvertTo-Json -Depth 5
              throw 'No available PC station was found for Agent session smoke.'
            }

            $stage9SmokeId = [Guid]::NewGuid().ToString('N').Substring(0, 8)
            $stage9Customer = Invoke-RestMethod -Uri "$baseUrl/api/customers" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              fullName = "Stage 9 Agent Smoke $stage9SmokeId"
              username = "stage9_agent_$stage9SmokeId"
              vipTier = 'none'
              concurrentLoginLimit = 1
              password = 'Stage9Smoke123!'
            } | ConvertTo-Json)
            if (-not $stage9Customer.id -or -not $stage9Customer.username) {
              throw 'Stage 9 smoke customer creation failed.'
            }

            $stage12Game = Invoke-RestMethod -Uri "$baseUrl/api/games" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              name = "Stage12 Game $stage9SmokeId"
              version = '1.0'
              genre = 'CI'
              status = 'online'
              path = 'C:\Games\Stage12'
              executable = 'Stage12.exe'
              cover = ''
              trailer = ''
              launchArgs = ''
              connectionType = 'آنلاین'
              active = $true
              targetSystem = 'all'
              target = 'all'
              targetZone = 'pc'
              targetStations = ''
            } | ConvertTo-Json)
            if (-not $stage12Game.id) { throw 'Stage 12 Game create smoke failed.' }

            $stage12Account = Invoke-RestMethod -Uri "$baseUrl/api/account-pool" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              title = "Stage12 Account $stage9SmokeId"
              platform = 'Steam'
              login = "stage12-login-$stage9SmokeId"
              secret = 'Stage12Secret!'
              owner = 'CI'
              expiresAt = $null
              allowedGameIds = @($stage12Game.id)
              status = 'Free'
            } | ConvertTo-Json)
            if (-not $stage12Account.id) { throw 'Stage 12 Account Pool create smoke failed.' }

            $customerAuth = Invoke-RestMethod -Uri "$baseUrl/api/customer-auth/login" -Method Post -ContentType 'application/json' -Body (@{
              usernameOrCode = $stage9Customer.username
              password = 'Stage9Smoke123!'
              clientKey = 'ci-stage9-session-agent'
            } | ConvertTo-Json)
            if (-not $customerAuth.authenticated -or -not $customerAuth.loginId -or $customerAuth.balance -ne 0) {
              throw 'Customer authentication for Agent session smoke failed or returned incomplete financial state.'
            }

            $env:GAMENET_SERVER_URL = $baseUrl
            $env:GAMENET_AGENT_REGISTRATION_TOKEN = 'Stage8CiRegistrationToken!'
            $env:GAMENET_AGENT_NAME = 'CI Agent Stage 9 Session'
            $env:GAMENET_AGENT_DEVICE_ID = 'ci-stage9-session-agent'
            $env:GAMENET_STATION_ID = $sessionStation.id
            $env:GAMENET_AGENT_DATA_DIR = $sessionAgentData
            $env:GAMENET_AGENT_HEADLESS = '1'
            $env:GAMENET_AGENT_TEST_SESSION_FLOW = '1'
            $env:GAMENET_AGENT_TEST_CUSTOMER_ID = $stage9Customer.id
            $env:GAMENET_AGENT_TEST_LOGIN_ID = $customerAuth.loginId
            $env:GAMENET_AGENT_TEST_GAME_ID = $stage12Game.id
            $env:GAMENET_AGENT_TEST_GAME_ACCOUNT_FLOW = '1'

            $sessionAgentProcess = Start-Process -FilePath 'dotnet' -ArgumentList @(
              'src/Client/bin/Release/net10.0-windows/GameNetManager.Client.dll'
            ) -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $sessionAgentStdout -RedirectStandardError $sessionAgentStderr

            try {
              $sessionFlowCompleted = $false
              $sessionStartVerified = $false
              $gameSyncVerified = $false
              $gameSyncCommandVerified = $false
              $endedSessionId = $null

              $syncAccepted = $false
              $syncCommandIds = @()
              for ($syncAttempt = 0; $syncAttempt -lt 20; $syncAttempt++) {
                try {
                  $syncResult = Invoke-RestMethod -Uri "$baseUrl/api/games/$($stage12Game.id)/sync" -Method Post -WebSession $adminSession
                  if ([int]$syncResult.targetedAgents -lt 1) { throw 'Stage 12 Game sync returned no targeted online Agent.' }
                  $syncCommandIds = @($syncResult.commands | Where-Object { $_.status -eq 'Sent' } | Select-Object -ExpandProperty commandId)
                  if ($syncCommandIds.Count -lt 1) { throw 'Stage 12 Game sync returned no persisted Agent command IDs.' }
                  $syncAccepted = $true
                  break
                } catch {
                  if ($syncAttempt -eq 19) { throw }
                  Start-Sleep -Milliseconds 500
                }
              }
              if (-not $syncAccepted) { throw 'Stage 12 real Game sync request did not reach an online Agent.' }

              for ($i = 0; $i -lt 30; $i++) {
                if ($sessionAgentProcess.HasExited) { break }
                if (Test-Path $sessionAgentStdout) {
                  $log = Get-Content $sessionAgentStdout -Raw

                  if (-not $gameSyncCommandVerified) {
                    $commandStates = @()
                    foreach ($commandId in $syncCommandIds) {
                      $commandStates += Invoke-RestMethod -Uri "$baseUrl/api/agent/commands/$commandId" -Method Get -WebSession $adminSession
                    }
                    if (@($commandStates | Where-Object { $_.status -eq 'Failed' }).Count -gt 0) {
                      throw 'Stage 12 Game Sync AgentCommand reported Failed.'
                    }
                    if ($commandStates.Count -eq $syncCommandIds.Count -and @($commandStates | Where-Object { $_.status -eq 'Succeeded' }).Count -eq $syncCommandIds.Count) {
                      $gameSyncCommandVerified = $true
                      Write-Host 'Stage 12 Game Sync AgentCommand lifecycle reached Succeeded.'
                    }
                  }

                  if (-not $gameSyncVerified -and $log -match 'CLIENT_GAME_APPLIED:([0-9a-fA-F]+)') {
                    $syncedGameId = $Matches[1]
                    if ($syncedGameId -ne ($stage12Game.id -replace '-', '')) {
                      throw "Stage 12 Game sync marker returned unexpected GameId: $syncedGameId"
                    }
                    $manifestPath = Join-Path $sessionAgentData "games\$syncedGameId.json"
                    if (-not (Test-Path $manifestPath)) {
                      throw 'Stage 12 Agent reported Game sync success but the local game manifest was not persisted.'
                    }
                    $gameSyncVerified = $true
                    Write-Host "Stage 12 real Game Apply/Sync persisted on Agent."
                  }

                  if (-not $sessionStartVerified -and $log -match 'AGENT_SESSION_START_OK:([0-9a-fA-F-]+)') {
                    $startedSessionId = $Matches[1]
                    $activeRows = Invoke-RestMethod -Uri "$baseUrl/api/sessions/active" -Method Get -WebSession $adminSession
                    if (-not @($activeRows | Where-Object { $_.id -eq $startedSessionId -and $_.stationName -eq $sessionStation.name })) {
                      throw 'Agent Session Start marker appeared but server active-session state did not contain the same SessionId/station.'
                    }

                    $customerStateAfterStart = Invoke-RestMethod -Uri "$baseUrl/api/customer-auth/state?customerId=$($stage9Customer.id)&loginId=$($customerAuth.loginId)&clientKey=$env:GAMENET_AGENT_DEVICE_ID" -Method Get
                    if (-not $customerStateAfterStart.authenticated -or $customerStateAfterStart.loginId -ne $customerAuth.loginId -or -not $customerStateAfterStart.session -or $customerStateAfterStart.session.id -ne $startedSessionId -or $customerStateAfterStart.session.state -ne 'Active') {
                      throw 'Stage 12 CustomerLogin → Session ownership was not visible through authoritative customer state after Agent Session Start.'
                    }

                    $activeGameRows = Invoke-RestMethod -Uri "$baseUrl/api/games" -Method Get -WebSession $adminSession
                    $activeGameRow = @($activeGameRows | Where-Object { $_.id -eq $stage12Game.id })[0]
                    if (-not $activeGameRow -or [int]$activeGameRow.activeUsers -ne 1) {
                      throw 'Stage 12 Game activeUsers did not become authoritative immediately after the active Session Start.'
                    }

                    $sessionStartVerified = $true
                    Write-Host ("Stage 9 Agent Session Start persisted server-side: sessionId={0}; station={1}; gameActiveUsers={2}" -f $startedSessionId, $sessionStation.name, $activeGameRow.activeUsers)
                  }

                  if ($log -match 'AGENT_SESSION_END_AUTH_GUARD_OK') {
                    Write-Host 'Stage 9 Agent Session End login ownership guard passed.'
                  }

                  if ($log -match 'AGENT_GAME_ACCOUNT_OK:([0-9a-fA-F-]+):([0-9a-fA-F-]+):([^:]+):(.+)') {
                    $gameLeaseId = $Matches[1]
                    $gameLeaseGameId = $Matches[2]
                    if ($gameLeaseGameId -ne $stage12Game.id) { throw "Stage 12 Agent received a credential for an unexpected GameId: $gameLeaseGameId" }
                    $accountRows = Invoke-RestMethod -Uri "$baseUrl/api/account-pool" -Method Get -WebSession $adminSession
                    $inUseAccount = @($accountRows | Where-Object { $_.id -eq $stage12Account.id })[0]
                    if (-not $inUseAccount -or $inUseAccount.status -ne 'InUse') { throw 'Stage 12 Account Pool entry did not become InUse after Agent acquisition.' }
                    Write-Host ("Stage 12 Agent Game account acquisition passed: leaseId={0}; gameId={1}" -f $gameLeaseId, $gameLeaseGameId)
                  }

                  if ($log -match 'AGENT_SESSION_END_OK:([0-9a-fA-F-]+)') {
                    $endedSessionId = $Matches[1]
                    $sessionFlowCompleted = $true
                    break
                  }
                }
                Start-Sleep -Seconds 1
              }

              $sessionDuplicateGuardVerified = $log -match 'AGENT_SESSION_DUPLICATE_GUARD_OK'
              $sessionEndLoginGuardVerified = $log -match 'AGENT_SESSION_END_LOGIN_GUARD_OK'

              if (-not $gameSyncVerified -or -not $gameSyncCommandVerified -or -not $sessionStartVerified -or -not $sessionDuplicateGuardVerified -or -not $sessionEndLoginGuardVerified -or -not $sessionFlowCompleted) {
                Write-Host '--- Stage 9 Session Agent stdout ---'
                if (Test-Path $sessionAgentStdout) { Get-Content $sessionAgentStdout }
                Write-Host '--- Stage 9 Session Agent stderr ---'
                if (Test-Path $sessionAgentStderr) { Get-Content $sessionAgentStderr }
                throw 'Agent-driven Session Start/End ownership and lifecycle smoke did not complete.'
              }

              $endedSession = Invoke-RestMethod -Uri "$baseUrl/api/sessions/$endedSessionId/settle" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
                totalAmount = 1000
                parts = @(@{ method = 'cash'; amount = 1000 })
                timeAmount = 1000
                discountAmount = 0
                prepaidAmount = 0
              } | ConvertTo-Json)

              if (-not $endedSession.invoiceId -or $endedSession.invoiceStatus -ne 'Paid') {
