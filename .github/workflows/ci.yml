              unitCost = 10000
              notes = 'Stage 6 purchase test'
            } | ConvertTo-Json)
            if ([int]$purchase.stock -ne 6 -or $purchase.kind -ne 'Purchase') { throw 'Inventory purchase smoke failed.' }

            $stockOut = Invoke-RestMethod -Uri ("$baseUrl/api/buffet/products/$($inventoryProduct.id)/stock") -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              quantity = 1
              direction = 'Out'
              kind = 'Waste'
              notes = 'Stage 6 waste test'
            } | ConvertTo-Json)
            if ([int]$stockOut.stock -ne 5 -or $stockOut.kind -ne 'Waste') { throw 'Inventory waste smoke failed.' }

            $returned = Invoke-RestMethod -Uri ("$baseUrl/api/buffet/products/$($inventoryProduct.id)/stock") -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              quantity = 1
              direction = 'In'
              kind = 'Return'
              notes = 'Stage 6 return test'
            } | ConvertTo-Json)
            if ([int]$returned.stock -ne 6 -or $returned.kind -ne 'Return') { throw 'Inventory return smoke failed.' }

            $sale = Invoke-RestMethod -Uri "$baseUrl/api/buffet/sales" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              items = @(@{ productId = $inventoryProduct.id; quantity = 4 })
              target = 'standalone'
            } | ConvertTo-Json)
            if ([int]$sale.total -ne 100000) { throw 'Buffet sale total smoke failed.' }

            $inventoryAfterSale = Invoke-RestMethod -Uri "$baseUrl/api/buffet/products" -Method Get -WebSession $adminSession
            $soldProduct = @($inventoryAfterSale | Where-Object { $_.id -eq $inventoryProduct.id })[0]
            if ([int]$soldProduct.stock -ne 2 -or -not $soldProduct.lowStock) { throw 'Buffet sale did not reduce server stock or low-stock state correctly.' }

            try {
              Invoke-RestMethod -Uri "$baseUrl/api/buffet/sales" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
                items = @(@{ productId = $inventoryProduct.id; quantity = 99 })
                target = 'standalone'
              } | ConvertTo-Json) | Out-Null
              throw 'Insufficient stock sale was not rejected.'
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              if ($status -ne 409) { throw }
            }

            $inventoryAfterRejectedSale = Invoke-RestMethod -Uri "$baseUrl/api/buffet/products" -Method Get -WebSession $adminSession
            $unchangedProduct = @($inventoryAfterRejectedSale | Where-Object { $_.id -eq $inventoryProduct.id })[0]
            if ([int]$unchangedProduct.stock -ne 2 -or -not $unchangedProduct.lowStock) { throw 'Rejected buffet sale changed server stock.' }

            $profit = Invoke-RestMethod -Uri "$baseUrl/api/buffet/reports/profit" -Method Get -WebSession $adminSession
            if ([int]$profit.totals.salesRevenue -ne 100000 -or [int]$profit.totals.purchaseCost -ne 10000 -or [decimal]$profit.totals.grossProfit -le 50000) {
              throw 'Buffet profit report smoke failed.'
            }

            $inventoryHistory = Invoke-RestMethod -Uri "$baseUrl/api/buffet/inventory-transactions" -Method Get -WebSession $adminSession
            if (-not @($inventoryHistory | Where-Object { $_.productId -eq $inventoryProduct.id -and $_.kind -eq 'Waste' })) { throw 'Inventory history did not contain waste movement.' }
            if (-not @($inventoryHistory | Where-Object { $_.productId -eq $inventoryProduct.id -and $_.kind -eq 'Return' })) { throw 'Inventory history did not contain return movement.' }
            if (-not @($inventoryHistory | Where-Object { $_.productId -eq $inventoryProduct.id -and $_.kind -eq 'Sale' })) { throw 'Inventory history did not contain sale movement.' }

            $updatedProduct = Invoke-RestMethod -Uri ("$baseUrl/api/buffet/products/$($inventoryProduct.id)") -Method Put -WebSession $adminSession -ContentType 'application/json' -Body (@{
              name = "Stage 6 Smoke Updated $inventoryId"
              category = 'تنقلات'
              unitPrice = 30000
              costPrice = 14000
              minimumStock = 1
              unit = 'بسته'
              isActive = $true
            } | ConvertTo-Json)
            if ($updatedProduct.name -ne "Stage 6 Smoke Updated $inventoryId" -or [int]$updatedProduct.price -ne 30000 -or [int]$updatedProduct.minimumStock -ne 1 -or $updatedProduct.unit -ne 'بسته') {
              throw 'Buffet product update smoke failed.'
            }

            $activeSessions = Invoke-RestMethod -Uri "$baseUrl/api/sessions/active" -Method Get -WebSession $adminSession
            if (-not @($activeSessions | Where-Object { $_.id -eq $startedSession.sessionId })) {
              throw 'Active session endpoint did not return the started session.'
            }

            $sessionSale = Invoke-RestMethod -Uri "$baseUrl/api/buffet/sales" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              items = @(@{ productId = $inventoryProduct.id; quantity = 1 })
              target = 'session'
              sessionId = $startedSession.sessionId
            } | ConvertTo-Json)

            if ($sessionSale.target -ne 'session' -or $sessionSale.sessionId -ne $startedSession.sessionId -or -not $sessionSale.invoiceId -or [int]$sessionSale.buffetTotal -ne 30000) {
              throw 'Buffet session sale did not create a draft invoice correctly.'
            }

            $sessionSettlement = Invoke-RestMethod -Uri "$baseUrl/api/sessions/$($startedSession.sessionId)/settle" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              totalAmount = 60000
              parts = @(@{ method = 'cash'; amount = 60000 })
              timeAmount = 30000
              discountAmount = 0
              prepaidAmount = 0
            } | ConvertTo-Json)

            if ($sessionSettlement.invoiceId -ne $sessionSale.invoiceId -or [int]$sessionSettlement.totalAmount -ne 60000 -or $sessionSettlement.invoiceStatus -ne 'Paid') {
              throw 'Session settlement did not finalize the buffet draft invoice.'
            }

            Invoke-RestMethod -Uri "$baseUrl/api/users/$($managedUser.id)/permissions" -Method Put -WebSession $adminSession -ContentType 'application/json' -Body (@{
              permissionNames = @('finance.manage')
            } | ConvertTo-Json) | Out-Null

            $operatorFinanceSession = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-RestMethod -Uri "$baseUrl/api/auth/login" -Method Post -WebSession $operatorFinanceSession -ContentType 'application/json' -Body (@{
              userName = $managedUser.userName
              password = 'Operator123!'
            } | ConvertTo-Json) | Out-Null

            try {
              Invoke-RestMethod -Uri "$baseUrl/api/invoices/$($sessionSale.invoiceId)/reverse" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
                reason = 'Stage 7 direct reverse bypass smoke'
              } | ConvertTo-Json) | Out-Null
              throw 'Direct invoice reverse endpoint bypassed the approval path.'
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              if ($status -ne 409) { throw }
            }

            $reverseApproval = Invoke-RestMethod -Uri "$baseUrl/api/invoices/$($sessionSale.invoiceId)/reverse/request" -Method Post -WebSession $operatorFinanceSession -ContentType 'application/json' -Body (@{
              reason = 'Stage 7 executable approval reverse smoke'
            } | ConvertTo-Json)
            if ($reverseApproval.status -ne 'Pending' -or -not $reverseApproval.id) {
              throw 'Invoice reverse approval request smoke failed.'
            }
            Invoke-RestMethod -Uri "$baseUrl/api/auth/logout" -Method Post -WebSession $operatorFinanceSession | Out-Null

            $reversed = Invoke-RestMethod -Uri "$baseUrl/api/approvals/$($reverseApproval.id)/approve" -Method Post -WebSession $adminSession -ContentType 'application/json' -Body (@{
              note = 'Stage 7 reverse approved and executed'
            } | ConvertTo-Json)

            if ($reversed.status -ne 'Approved' -or $reversed.operation.invoiceStatus -ne 'Cancelled' -or [int]$reversed.operation.inventoryRestored -ne 1) {
              throw 'Executable invoice reverse approval smoke failed.'
            }

            $profitAfterReverse = Invoke-RestMethod -Uri "$baseUrl/api/buffet/reports/profit" -Method Get -WebSession $adminSession
            if ([decimal]$profitAfterReverse.totals.returnRevenue -lt 30000) {
              throw 'Buffet reverse profit adjustment smoke failed.'
            }

            $inventoryAfterReverse = Invoke-RestMethod -Uri "$baseUrl/api/buffet/products" -Method Get -WebSession $adminSession
            $reversedProduct = @($inventoryAfterReverse | Where-Object { $_.id -eq $inventoryProduct.id })[0]
            if ([int]$reversedProduct.stock -ne 2) { throw 'Buffet invoice reverse did not restore stock.' }

            $adminLogout = Invoke-RestMethod -Uri "$baseUrl/api/auth/logout" -Method Post -WebSession $adminSession
            if (-not $adminLogout.success) { throw 'Server operator logout smoke failed.' }

            Write-Host 'Stage 5 Customer CRUD + VIP package + credentials + concurrent login + debt API smoke passed.'

          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Install Dashboard
        run: npm ci --prefix src/Dashboard

      - name: Lint Dashboard
        run: npm run lint --prefix src/Dashboard

      - name: Build Dashboard
        run: npm run build --prefix src/Dashboard

      - name: Start Dashboard preview
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'npm.cmd' -ArgumentList @('run','preview','--prefix','src/Dashboard','--','--host','127.0.0.1','--port','4173') -PassThru
          $process.Id | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'gamenet-dashboard.pid') -Encoding utf8
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $response) { throw 'Dashboard preview did not start on port 4173.' }

      - name: Install Dashboard browser test dependency
        shell: pwsh
        run: npm install --prefix src/Dashboard --no-save --no-package-lock @playwright/test@1.63.0

      - name: Dashboard interaction smoke
        shell: pwsh
        run: |
          $env:NODE_PATH = Join-Path $env:GITHUB_WORKSPACE 'src\Dashboard\node_modules'
          npx --prefix src/Dashboard playwright test --config "$env:GITHUB_WORKSPACE\e2e\playwright.config.cjs" --workers=1

      - name: Stop Dashboard preview
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'gamenet-dashboard.pid'
          if (Test-Path $pidFile) {
            $processId = Get-Content $pidFile | Select-Object -First 1
            if ($processId) { Stop-Process -Id ([int]$processId) -Force -ErrorAction SilentlyContinue }
            Remove-Item $pidFile -Force -ErrorAction SilentlyContinue
          }
