name: Extract 2.rar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract archive
        shell: bash
        run: |
          test -f 2.rar
          mkdir -p .extract_tmp
          7z x 2.rar -o.extract_tmp -y
          cp -a .extract_tmp/. .
          rm -rf .extract_tmp
          echo "=== Extracted files ==="
          find . -maxdepth 4 -type f ! -path './.git/*' | sort

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract 2.rar into repository"
          git push origin HEAD:main
